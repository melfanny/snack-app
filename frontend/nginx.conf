server {
    listen 80;
    server_name snackdetector.my.id www.snackdetector.my.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://snackdetector.my.id$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name snackdetector.my.id www.snackdetector.my.id;

    ssl_certificate /etc/letsencrypt/live/snackdetector.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snackdetector.my.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}