<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snack Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Chewy&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #fffaf0; color: #222; }
      .layout { min-height: 100vh; display: flex; flex-direction: column; }

      header { background: linear-gradient(90deg, #ffc107, #ffb300); height: 60px; display: flex; align-items: center; padding: 0 16px; gap: 16px; justify-content: space-between; box-shadow: 0 2px 6px #0003; z-index: 2; }
      .burger { font-size: 26px; cursor: pointer; user-select: none; }
      .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
      .logo { width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 2px solid #222; box-shadow: 2px 2px #222; display: flex; align-items: center; justify-content: center; font-size: 22px; }
      .brand-name { font-family: 'Chewy', cursive; font-size: 26px; letter-spacing: 1px; color: #222; text-shadow: 2px 2px #fff; }
      .brand:hover .logo { transform: rotate(-12deg); }
      .page-title { font-family: 'Chewy', cursive; font-size: clamp(30px, 6vw, 48px); margin: 8px 0 16px; text-shadow: 3px 3px #ffc107; }

      .body { flex: 1; display: flex; position: relative; }
      nav { background: #f0e6d2; width: 220px; flex-shrink: 0; padding: 40px 20px; display: flex; flex-direction: column; gap: 22px; box-shadow: 2px 0 6px #0002; }
      main { flex: 1; padding: 16px; text-align: center; min-width: 0; }

      button { padding: 12px; border: 2px solid #222; background: #fff; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px #222; transition: transform .1s, box-shadow .1s; }
      button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px #222; }
      button:active { transform: translate(2px, 2px); box-shadow: 1px 1px #222; }
      button.active, button.primary { background: #ffc107; }

      /* Halaman awal */
      .home { margin-top: 8vh; }
      .home h1 { font-family: 'Chewy', cursive; font-size: clamp(48px, 11vw, 110px); line-height: 1; margin: 0; color: #222; text-shadow: 5px 5px #ffc107; }
      .home h2 { font-family: 'Archivo Black', sans-serif; font-size: clamp(36px, 9vw, 80px); line-height: 1; margin: 8px 0 28px; color: #fff; -webkit-text-stroke: 2px #222; letter-spacing: 2px; }
      .home button { font-size: 20px; padding: 14px 36px; }

      /* Halaman deteksi */
      .wrap, .card { max-width: 640px; margin-left: auto; margin-right: auto; }
      .box { position: relative; border: 3px solid #222; border-radius: 14px; background: #fff; min-height: 220px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #999; }
      .box.has-image { min-height: 0; }
      .box img, .box video { width: 100%; display: block; }
      .detection-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; color: #222; background: rgba(255, 250, 240, .9); text-align: center; }
      .loading-spinner { width: 42px; height: 42px; border: 5px solid #f0e6d2; border-top-color: #ffb300; border-radius: 50%; animation: loading-spin .8s linear infinite; }
      .loading-bar { width: min(220px, 80%); height: 7px; overflow: hidden; border-radius: 6px; background: #f0e6d2; }
      .loading-bar i { display: block; width: 40%; height: 100%; border-radius: inherit; background: #ffc107; animation: loading-progress 1.4s ease-in-out infinite; }
      @keyframes loading-spin { to { transform: rotate(360deg); } }
      @keyframes loading-progress { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      button:disabled { opacity: .6; cursor: wait; transform: none; }
      @media (prefers-reduced-motion: reduce) { .loading-spinner, .loading-bar i { animation-duration: 2.5s; } }
      .row { display: flex; gap: 12px; margin: 16px 0; }
      .row button { flex: 1; }
      .bbox { position: absolute; border: 3px solid #e53935; border-radius: 4px; cursor: pointer; }
      .bbox span { background: #e53935; color: #fff; font-size: 11px; padding: 1px 4px; position: absolute; top: -1px; left: -1px; }
      .bbox.low { border-color: #2e7d32; } .bbox.low span { background: #2e7d32; }
      .bbox.sel { box-shadow: 0 0 0 3px #ffc107, 0 0 12px #ffc107; z-index: 1; }

      /* Daftar hasil: bisa discroll & diklik */
      .list { max-height: 260px; overflow-y: auto; text-align: left; padding: 4px; border-radius: 12px; background: #f0e6d2; }
      .item { padding: 10px 12px; background: #fff; margin: 6px 0; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 2px solid transparent; }
      .item:hover { border-color: #ffc107; }
      .item.low { background: #c8f7c5; font-weight: bold; }
      .models { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .models button { padding: 6px 14px; font-size: 14px; box-shadow: 2px 2px #222; }
      .used { margin: 8px 0; }
      .brand-group { margin-bottom: 12px; }
      .brand-title { font-weight: bold; margin-bottom: 6px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { background: #ffc107; border: 2px solid #222; border-radius: 20px; padding: 3px 12px; font-size: 14px; }
      .note { margin-top: 16px; text-align: left; background: #fff3cd; border: 2px solid #222; border-radius: 12px; padding: 4px 16px; font-size: 14px; grid-column: 1 / -1; }
      .item .name { flex: 1; min-width: 0; word-break: break-word; }
      .item .cal { white-space: nowrap; }
      .del { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: #ffe5e5; border: 1px solid #e53935; cursor: pointer; font-size: 15px; }
      .del:hover { background: #e53935; }
      .x { position: absolute; top: 8px; right: 8px; background: #e53935; color: #fff; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; }
      .item.sel { border-color: #222; }

      .card { text-align: left; background: #fff; border: 2px solid #222; border-radius: 14px; padding: 4px 20px 12px; box-shadow: 4px 4px #222; }

      /* Halaman estimasi harga */
      .price { max-width: 640px; margin: 0 auto; text-align: left; }
      .price .box { margin-bottom: 0; }
      .price-item { background: #fff; border: 2px solid #222; border-radius: 14px; padding: 12px; margin: 10px 0; box-shadow: 3px 3px #222; }
      .price-item { cursor: pointer; } .price-item.sel { background: #fff3cd; }
      .price .hint { margin: 12px 0 0; color: #666; font-size: 14px; }
      .price-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
      .price-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
      .chips button.gram { padding: 4px 12px; font-size: 13px; box-shadow: 2px 2px #222; }
      .qty { display: flex; align-items: center; gap: 10px; }
      .qty button { width: 34px; height: 34px; padding: 0; line-height: 1; }
      .qty span { min-width: 24px; text-align: center; font-weight: bold; }
      .add-snack { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
      .add-snack select { flex: 1; min-width: 200px; padding: 10px; border: 2px solid #222; border-radius: 12px; font-size: 15px; background: #fff; }
      .summary { background: #ffc107; max-width: none; }
      .summary p { margin: 8px 0 0; }
      .summary h3 { margin: 4px 0 8px; font-family: 'Archivo Black', sans-serif; font-size: 30px; }
      @media (min-width: 1000px) {
        .price { max-width: 1100px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; align-items: start; }
        .price-left { position: sticky; top: 16px; }
      }

      /* HP: sidebar menumpuk di atas konten (konten tetap di tengah layar) */
      @media (max-width: 700px) {
        nav { position: absolute; top: 0; bottom: 0; left: 0; z-index: 1; }
      }

      /* Layar lebar: halaman hasil jadi 2 kolom (gambar | daftar) */
      @media (min-width: 1000px) {
        .wrap.result { max-width: 960px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; align-items: start; }
        .wrap.result .box { grid-column: 1; grid-row: 1; }
        .wrap.result .list { grid-column: 2; grid-row: 1; max-height: 420px; }
        .wrap.result .row { grid-column: 1 / -1; grid-row: 2; max-width: 300px; width: 100%; margin: 16px auto; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
